[project]
name = "postmarked-api"
version = "0.1.0"
description = "Postmarked API Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "geoalchemy2>=0.14.7",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "fastapi-users[sqlalchemy,oauth]>=13.0.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "pillow-heif>=0.16.0",
    "watchdog>=4.0.0",
    "blurhash-python>=1.2.2",
    "openpyxl>=3.1.5",
    # openpyxl auto-detects defusedxml and then refuses DTDs; without it the
    # stdlib parser expands internal entities inside the API process.
    "defusedxml>=0.7.1",
    "timezonefinder>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Importing every model class is what registers it on Base.metadata, so
# SQLAlchemy can resolve relationships and alembic autogenerate can see the
# full schema. The names are unused by design.
"app/models/__init__.py" = ["F401", "F403"]
# Logging is configured before the application imports so uvicorn's handlers
# are restamped at import time, and the admin routers are mounted at the end
# of the module after the app object exists.
"app/main.py" = ["E402"]
# register_heif_opener() must run before any code path decodes a HEIC file.
"app/tasks.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
# The project is not installed into the venv, so `app` is imported from the source tree.
pythonpath = ["."]
markers = [
    "live: tests that call external APIs (opt-in via -m live)",
]
