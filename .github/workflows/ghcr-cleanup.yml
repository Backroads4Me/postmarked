name: Clean Up Beta Images

permissions:
  packages: write

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete old beta images
    runs-on: ubuntu-24.04
    steps:
      # Deletes sha-* beta images older than 30 days and untagged leftovers.
      # The action keeps the per-platform images that tagged multi-arch
      # manifests point to, so release tags and latest stay intact.
      - name: Clean up GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: postmarked-api,postmarked-web,postmarked-postgis
          delete-tags: sha-*
          older-than: 30 days
          exclude-tags: latest,beta
          delete-untagged: true
          dry-run: true
